name: Capture temporary design system v2 baselines

on:
  workflow_dispatch:
  push:
    branches:
      - feat/design-system-v2

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/evidence-linux-py311.txt
      - run: pip install -r requirements.txt -c constraints/evidence-linux-py311.txt
        working-directory: .
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-v2-linux-baselines
          path: frontend/e2e/snapshots/
          if-no-files-found: error
          retention-days: 7

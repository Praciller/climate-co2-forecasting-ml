name: Temporary evidence determinism probe

on:
  push:
    branches:
      - fix/hosted-runner-evidence-determinism

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4
      DNNL_MAX_CPU_ISA: AVX2
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/evidence-linux-py311.txt
      - name: Install canonical dependencies
        run: python -m pip install -r requirements.txt -c constraints/evidence-linux-py311.txt
      - name: Capture runtime fingerprint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/probe-output"
          {
            echo "replica=${{ matrix.replica }}"
            uname -a
            lscpu
            python -c 'import os, platform, torch; import numpy as np; from threadpoolctl import threadpool_info; print("platform=", platform.platform()); print("numpy=", np.__version__); np.show_runtime(); print("threadpools=", threadpool_info()); print("torch=", torch.__version__); print("torch.cpu_capability=", torch.backends.cpu.get_cpu_capability()); print("torch.parallel_info=", torch.__config__.parallel_info()); [print(name + "=" + os.environ.get(name, "<unset>")) for name in ("OPENBLAS_CORETYPE", "NPY_DISABLE_CPU_FEATURES", "ATEN_CPU_CAPABILITY", "DNNL_MAX_CPU_ISA")]'
          } > "$RUNNER_TEMP/probe-output/fingerprint.txt" 2>&1
          sed -n '1,220p' "$RUNNER_TEMP/probe-output/fingerprint.txt"
      - name: Generate governed evidence
        run: python -m src.pipeline
      - name: Collect probe hashes and numerical summary
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          from scripts.verify_generated_evidence import parse_artifact_policy, select_policy_paths

          root = Path.cwd()
          output = Path("${{ runner.temp }}") / "probe-output"
          verification = (root / "docs" / "verification.md").read_text(encoding="utf-8")
          tracked = [item.decode("utf-8") for item in subprocess.check_output(["git", "ls-files", "-z", "--cached"], cwd=root).split(b"\0") if item]
          policy_paths = select_policy_paths(tracked, parse_artifact_policy(verification))
          hashes = {relative: hashlib.sha256((root / Path(*Path(relative).parts)).read_bytes()).hexdigest() for relative in policy_paths}
          (output / "governed-evidence.sha256").write_text("\n".join(f"{digest}  {path}" for path, digest in hashes.items()) + "\n", encoding="utf-8")
          forecast = json.loads((root / "reports" / "forecast_metrics.json").read_text())
          interval = json.loads((root / "reports" / "forecast_interval_evaluation.json").read_text())
          anomalies = list(csv.DictReader((root / "reports" / "anomalies.csv").open(encoding="utf-8")))
          selected = forecast["selection"]["selected_model"]
          final_models = forecast["final_test"]["models"]
          summary = {"selected_model": selected, "development_mae": forecast["validation"]["models"][selected]["mae"], "final_test_mae": final_models[selected]["mae"], "interval_coverage": interval["empirical_coverage"], "isolation_forest_count": sum(row["isolation_forest_anomaly"] == "True" for row in anomalies), "residual_count": sum(row["residual_anomaly"] == "True" for row in anomalies)}
          (output / "numerical-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          print(f"policy_file_count={len(policy_paths)}")
          PY
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-dnnl-${{ matrix.replica }}-${{ github.run_id }}
          path: ${{ runner.temp }}/probe-output/
          if-no-files-found: warn
          retention-days: 3

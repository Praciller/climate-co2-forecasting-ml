name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m compileall -q src
      - name: Execute EDA notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/01_eda.ipynb
          --output 01_eda.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=180
      - run: python -c "from src.api.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4
      DNNL_MAX_CPU_ISA: AVX2
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/evidence-linux-py311.txt
      - run: pip install -r requirements.txt -c constraints/evidence-linux-py311.txt
      - run: ruff check src tests
      - name: Regenerate governed evidence
        run: python -m src.pipeline
      - name: Verify governed evidence drift
        run: python scripts/verify_generated_evidence.py
      - name: Smoke package serving bundle CLI
        run: >-
          python -m scripts.package_serving_bundle
          --root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/ci-serving-bundle.tar.gz"
      - run: python -m pytest
      - run: python -m compileall -q src
      - run: python -m src.verify_repository
      - run: docker compose config --quiet
      - name: Execute EDA notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/01_eda.ipynb
          --output 01_eda.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=180
      - run: python -c "from src.api.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storybook
      - run: npm audit --audit-level=high

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4
      DNNL_MAX_CPU_ISA: AVX2
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/evidence-linux-py311.txt
      - run: pip install -r requirements.txt -c constraints/evidence-linux-py311.txt
        working-directory: .
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser E2E and visual regression
        run: npm run test:e2e
      - name: Verify committed visual baselines
        if: always()
        run: npm run test:e2e:verify-baselines
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

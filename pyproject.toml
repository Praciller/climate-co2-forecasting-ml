[project]
name = "co2-forecast-lab-serving"
version = "0.1.0"
description = "Serving-only dependency declaration for the Vercel FastAPI function."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "statsmodels>=0.14,<0.15",
  "uvicorn[standard]>=0.30,<1",
]

[tool.vercel]
entrypoint = "api.index:app"
